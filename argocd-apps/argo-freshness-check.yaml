apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-freshness-check
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alvaroolazabal88-hub/kubernetes-by-the-hour.git
    targetRevision: main
    path: gitops/argo-freshness-check
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true